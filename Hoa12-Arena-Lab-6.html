<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HÓA 12 ARENA — Phòng thí nghiệm bí ẩn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lexend:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08111f;
  --bg2: #0c1829;
  --panel: #101e32;
  --panel2: #162943;
  --card: #12243a;
  --ink: #edf5ff;
  --muted: #9fb2ca;
  --line: #29415d;
  --track: #1a2f48;
  --cyan: #55e6df;
  --cyan-ink: #06151e;
  --gold: #ffd166;
  --gold-ink: #2a1a00;
  --pink: #ff6b9a;
  --green: #78e08f;
  --ok-bg: #123d2c;
  --bad-bg: #3a1a28;
  --code: #0f1f33;
  --sh-1: 0 1px 2px rgba(0,0,0,.35);
  --sh-2: 0 6px 18px rgba(0,0,0,.4);
  --sh-3: 0 18px 40px rgba(0,0,0,.5);
  --font-d: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-b: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: radial-gradient(ellipse at top, #163456 0%, var(--bg) 65%);
  color: var(--ink);
  font-family: var(--font-b);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 14px 16px 64px;
  position: relative;
  z-index: 2;
}
h1, h2, h3, h4 {
  font-family: var(--font-d);
  margin: 0;
  line-height: 1.22;
  letter-spacing: -.01em;
}
p { margin: 0 0 10px; }
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease, border-color .12s ease, opacity .12s ease;
}
button:active:not(:disabled) { transform: translateY(1px); }
button:focus-visible, summary:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}
button:disabled { cursor: default; }
sub, sup { font-size: .72em; line-height: 0; }
.hidden { display: none !important; }

/* Header */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 0 -16px 16px;
  padding: 14px 16px;
  background: rgba(8, 17, 31, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-family: var(--font-d);
  font-weight: 800;
  font-size: 1.05rem;
  background: none;
  border: 0;
  padding: 4px 0;
  text-align: left;
  letter-spacing: -.01em;
}
.brand span { color: var(--cyan); }
.hud { display: flex; gap: 8px; }
.pill {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 13px;
  font-size: .84rem;
  white-space: nowrap;
  box-shadow: var(--sh-1);
  color: #cfe3f9;
}
.pill b { font-family: var(--font-d); color: var(--gold); }

/* Name gate */
.gate {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: rgba(3,9,20,.92); padding: 20px;
  backdrop-filter: blur(8px);
}
.gatebox {
  width: min(360px, 100%);
  background: linear-gradient(160deg, #12243a, #0d1b2e);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 28px 22px 22px;
  text-align: center;
  box-shadow: var(--sh-3);
}
.gatebox h2 { font-size: 1.55rem; margin-bottom: 8px; }
.gatebox p { color: var(--muted); font-size: .95rem; margin-bottom: 18px; }
.gatebox input {
  width: 100%; font: inherit; padding: 12px 14px;
  border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); margin-bottom: 14px;
  text-align: center;
}
.gatebox input:focus { border-color: var(--cyan); outline: none; }
.gatebox .btn { width: 100%; }
.gatebox .tiny { font-size: .8rem; color: var(--muted); margin-top: 12px; }

/* Floating AI / Search button */
.fab {
  position: fixed;
  right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 20;
  width: 54px; height: 54px;
  border-radius: 16px;
  border: 0;
  background: linear-gradient(145deg, #2dd4bf, #14b8a6);
  color: #042f2e;
  display: grid; place-items: center;
  box-shadow: 0 8px 24px rgba(20,184,166,.4);
  cursor: pointer;
}
.fab:hover { filter: brightness(1.08); transform: translateY(-2px); }
.fab svg { width: 24px; height: 24px; }

/* AI panel overlay */
.aipanel {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(3,9,20,.88);
  display: none; align-items: flex-end; justify-content: center;
  padding: 12px;
  backdrop-filter: blur(6px);
}
.aipanel.show { display: flex; }
.aipanel .inner {
  width: min(520px, 100%);
  max-height: 88vh;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px 20px 16px 16px;
  padding: 16px;
  box-shadow: var(--sh-3);
}
.aipanel .ahead {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.aipanel .ahead h3 { margin: 0; font-size: 1.1rem; }

/* Leaderboard modal */
.lbmodal {
  position: fixed; inset: 0; z-index: 45;
  background: rgba(3,9,20,.9);
  display: none; align-items: center; justify-content: center;
  padding: 16px;
}
.lbmodal.show { display: flex; }
.lbmodal .inner {
  width: min(400px, 100%);
  max-height: 80vh; overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
}
.lbrow {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; margin: 6px 0;
  background: var(--card); border-radius: 10px; border: 1px solid var(--line);
}
.lbrow .rank { color: var(--gold); font-weight: 800; font-family: var(--font-d); width: 28px; }
.lbrow .nm { flex: 1; font-weight: 600; }
.lbrow .pts { color: var(--cyan); font-weight: 700; }

/* Home */
.hero { padding: 10px 2px 6px; text-align: center; }
.hero .eyebrow {
  color: var(--cyan);
  font-weight: 800;
  letter-spacing: 3px;
  font-size: 12px;
  margin-bottom: 8px;
}
.hero h1 {
  font-size: clamp(1.9rem, 8vw, 2.8rem);
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1.1;
}
.hero h1 span { color: var(--cyan); }
.hero p {
  color: var(--muted);
  max-width: 52ch;
  margin: 12px auto 0;
  font-size: 1.01rem;
}
.grid { display: grid; gap: 12px; margin: 22px 0 14px; }
.cc {
  display: flex;
  gap: 14px;
  align-items: center;
  width: 100%;
  text-align: left;
  background: linear-gradient(145deg, rgba(22, 41, 67, 0.9), rgba(16, 30, 50, 0.9));
  border: 1px solid var(--line);
  border-left: 4px solid var(--ac);
  border-radius: 16px;
  padding: 14px;
  box-shadow: var(--sh-1);
  backdrop-filter: blur(4px);
}
.cc:hover {
  box-shadow: var(--sh-2);
  transform: translateY(-2px);
  border-color: #4e829b;
}
.cc h3 { font-size: 1.08rem; font-weight: 700; }
.cc .sub { color: var(--muted); font-size: .9rem; margin-top: 1px; }
.cc .pg { color: var(--muted); font-size: .8rem; margin-top: 6px; }
.tile {
  flex: none;
  width: 56px;
  height: 56px;
  border-radius: 12px;
  background: linear-gradient(155deg, var(--ac), color-mix(in srgb, var(--ac) 70%, black));
  color: var(--acink);
  position: relative;
  display: grid;
  place-items: center;
  font-family: var(--font-d);
  font-weight: 800;
  font-size: 1.6rem;
  box-shadow: var(--sh-1);
}
.tile small {
  position: absolute;
  top: 4px;
  left: 7px;
  font-size: .6rem;
  font-weight: 600;
  opacity: .85;
}
.mixcard {
  border-style: dashed;
  background: linear-gradient(145deg, rgba(40, 32, 20, 0.7), rgba(22, 30, 40, 0.85));
}
.note {
  color: var(--muted);
  font-size: .85rem;
  margin-top: 18px;
  padding: 12px 14px;
  background: var(--code);
  border-radius: 12px;
  border: 1px solid var(--line);
}

/* Chapter */
.link {
  background: none;
  border: 0;
  padding: 6px 2px;
  color: var(--cyan);
  font-weight: 600;
  border-radius: 8px;
}
.link:hover { background: var(--code); }
.chhead { display: flex; gap: 14px; align-items: center; margin: 10px 0 4px; }
.chhead h2 { font-size: 1.55rem; }
.chhead p { color: var(--muted); margin: 2px 0 0; font-size: .92rem; }
.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  margin: 16px 0;
  padding: 4px;
  background: var(--track);
  border-radius: 14px;
  -webkit-overflow-scrolling: touch;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 10px;
  padding: 9px 15px;
  font-weight: 600;
  font-size: .92rem;
}
.tab[aria-selected="true"] {
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--sh-1);
  border: 1px solid var(--line);
}

.card {
  background: linear-gradient(145deg, rgba(22, 41, 67, 0.92), rgba(16, 30, 50, 0.92));
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: var(--sh-1);
  backdrop-filter: blur(4px);
}
details.card { border-left: 4px solid var(--ac); padding: 0; }
details.card summary {
  padding: 15px 17px;
  font-family: var(--font-d);
  font-weight: 700;
  cursor: pointer;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
details.card summary::-webkit-details-marker { display: none; }
details.card summary::after {
  content: "+";
  font-weight: 500;
  color: var(--muted);
  font-size: 1.2rem;
  flex: none;
}
details.card[open] summary::after { content: "–"; }
details.card[open] summary { border-bottom: 1px solid var(--line); }
.lb { padding: 14px 17px 16px; }
.lb ul { margin: 0 0 10px; padding-left: 20px; }
.lb li { margin-bottom: 4px; }
.rx {
  background: var(--code);
  border-radius: 10px;
  padding: 9px 13px;
  overflow-x: auto;
  white-space: nowrap;
  font-size: .95rem;
  border: 1px solid var(--line);
}
.key {
  border-left: 4px solid var(--gold);
  background: var(--code);
  border-radius: 0 10px 10px 0;
  padding: 9px 13px;
  margin: 0 0 10px;
}
.tw { overflow-x: auto; margin: 0 0 10px; border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td {
  border: 1px solid var(--line);
  padding: 7px 10px;
  text-align: left;
  vertical-align: top;
}
th { background: var(--code); font-weight: 600; }

.btn {
  display: inline-block;
  border: 0;
  border-radius: 12px;
  padding: 12px 20px;
  font-family: var(--font-d);
  font-weight: 700;
  background: var(--cyan);
  color: var(--cyan-ink);
  box-shadow: var(--sh-1);
}
.btn:hover:not(:disabled) { filter: brightness(1.08); box-shadow: var(--sh-2); }
.btn:disabled { opacity: .5; box-shadow: none; }
.btn.ghost {
  background: transparent;
  border: 1.5px solid var(--line);
  color: var(--ink);
  font-weight: 600;
  box-shadow: none;
}
.btn.ghost:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
.btn.sm { padding: 8px 14px; font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.hint { color: var(--muted); font-size: .86rem; }

/* Flashcards + matching */
.seg { display: flex; gap: 6px; margin-bottom: 12px; }
.fc {
  width: 100%;
  min-height: 180px;
  text-align: center;
  display: grid;
  place-items: center;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  font-family: var(--font-d);
  font-size: 1.15rem;
  line-height: 1.45;
}
.fc.back {
  background: var(--ac);
  color: var(--acink);
  border-color: var(--ac);
  font-family: var(--font-b);
  font-size: 1.02rem;
  font-weight: 500;
}
.fc small {
  display: block;
  color: var(--muted);
  font-family: var(--font-b);
  font-size: .8rem;
  margin-top: 8px;
}
.fc.back small { color: inherit; opacity: .75; }
.prog {
  height: 6px;
  border-radius: 99px;
  background: var(--track);
  overflow: hidden;
  margin-bottom: 10px;
}
.prog i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), #a3ffce);
  transition: width .3s;
}
.mg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mi {
  border: 1.5px solid var(--line);
  background: var(--card);
  border-radius: 10px;
  padding: 10px;
  font-size: .88rem;
  text-align: left;
  min-height: 56px;
  color: var(--ink);
}
.mi.sel {
  border-color: var(--gold);
  background: #44391e;
  box-shadow: 0 0 0 2px var(--gold) inset;
}
.mi.done {
  background: var(--ok-bg);
  border-color: var(--green);
  opacity: .75;
}
.mi.bad {
  background: var(--bad-bg);
  border-color: var(--pink);
  animation: shake .3s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

/* Quiz */
.qmeta {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: .86rem;
  margin-bottom: 6px;
}
.qtext {
  font-family: var(--font-d);
  font-weight: 500;
  font-size: 1.1rem;
  line-height: 1.45;
  margin-bottom: 12px;
}
.opts { display: grid; gap: 10px; }
.opt {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 11px 13px;
  color: var(--ink);
}
.opt .k {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: var(--track);
  display: grid;
  place-items: center;
  font-weight: 600;
  font-size: .85rem;
}
.opt:hover:not(:disabled) { border-color: var(--cyan); }
.opt.ok { background: var(--ok-bg); border-color: var(--green); }
.opt.ok .k { background: var(--green); color: #06151e; }
.opt.bad { background: var(--bad-bg); border-color: var(--pink); }
.opt.bad .k { background: var(--pink); color: #fff; }
.tfr {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 8px;
}
.tfr .tg { display: flex; gap: 8px; margin-top: 8px; }
.tfr .tg button {
  flex: 1;
  border: 1.5px solid var(--line);
  background: transparent;
  border-radius: 9px;
  padding: 6px;
  color: var(--ink);
}
.tfr .tg button[aria-pressed="true"] {
  background: var(--cyan);
  color: var(--cyan-ink);
  border-color: var(--cyan);
}
.tfr.ok { border-color: var(--green); background: var(--ok-bg); }
.tfr.bad { border-color: var(--pink); background: var(--bad-bg); }
.tfr .ex { font-size: .88rem; margin-top: 6px; }
.sa { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sa input {
  flex: 1;
  min-width: 120px;
  font: inherit;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
}
.fb {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--code);
  font-size: .94rem;
}
.fb.ok { background: var(--ok-bg); }
.fb.bad { background: var(--bad-bg); }
.big {
  font-family: var(--font-d);
  font-weight: 800;
  font-size: 2.4rem;
  color: var(--gold);
}

/* Lab vials */
.labintro { color: var(--muted); font-size: .94rem; }
h4 {
  font-size: .82rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
  margin: 20px 0 10px;
  font-weight: 600;
}
.vials {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 4px 0 6px;
  background: var(--code);
  border-radius: 16px;
  padding: 16px 10px 14px;
  border: 1px solid var(--line);
}
.vial { text-align: center; position: relative; }
.vlabel {
  font-family: var(--font-d);
  font-weight: 800;
  font-size: .88rem;
  margin-bottom: 8px;
  color: var(--ink);
}
.glasswrap { position: relative; width: 100%; max-width: 82px; margin: 0 auto; }
.glass {
  position: relative;
  height: 96px;
  border: 2.5px solid var(--ink);
  border-top: none;
  border-radius: 0 0 22px 22px;
  background: #0e1c2e;
  overflow: hidden;
  box-shadow: inset 0 -3px 6px rgba(0,0,0,.3), 0 2px 4px rgba(0,0,0,.2);
}
.glass::before {
  content: "";
  position: absolute;
  left: -6px;
  right: -6px;
  top: -2.5px;
  height: 2.5px;
  background: var(--ink);
}
.glass::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,.5);
  opacity: 0;
  pointer-events: none;
}
.glass.pour::after { animation: pourflash .7s ease; }
@keyframes pourflash {
  0% { opacity: .7; }
  100% { opacity: 0; }
}
.gloss {
  position: absolute;
  top: 8%;
  left: 12%;
  width: 16%;
  height: 64%;
  border-radius: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0));
  pointer-events: none;
}
.liquid {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 0%;
  background: rgba(85,230,223,.35);
  transition: height .5s cubic-bezier(.4,0,.2,1), background-color .5s ease;
}
.liquid::before {
  content: "";
  position: absolute;
  top: -3px;
  left: 0;
  right: 0;
  height: 6px;
  border-radius: 50%;
  background: inherit;
  opacity: .9;
}
.liquid.filled { height: 60%; }
.liquid.c-clear { background: rgba(85,230,223,.28); }
.liquid.c-blue { background: rgba(24,88,214,.8); }
.liquid.c-violet { background: rgba(63,32,140,.82); }
.liquid.c-layer {
  background: linear-gradient(to bottom, rgba(255,209,102,.72) 0 45%, rgba(24,120,132,.42) 45% 100%);
}
.ppt {
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: 0;
  height: 0;
  border-radius: 3px 3px 9px 9px;
  transition: height .5s ease;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.2);
}
.ppt.show { height: 26%; }
.ppt.p-white { background: #e8f0ee; border: 1.5px solid #8aa0a0; }
.ppt.p-yellow { background: #F3C61B; border: 1.5px solid #B5900E; }
.ppt.p-brick { background: #B14523; border: 1.5px solid #7C2F16; }
.ppt.p-blue { background: #1E52C9; border: 1.5px solid #17398F; }
.ppt.p-curd { background: #EDE4C8; border: 1.5px solid #C2B589; border-radius: 6px; }
.bubbles { position: absolute; inset: 0; pointer-events: none; }
.bub-p {
  position: absolute;
  bottom: 6px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,.9);
  box-shadow: 0 0 2px rgba(0,0,0,.2);
  animation: rise 1.4s ease-in infinite;
}
@keyframes rise {
  0% { transform: translateY(0); opacity: .95; }
  100% { transform: translateY(-72px); opacity: 0; }
}
.mirror {
  position: absolute;
  inset: 6px 3px auto 3px;
  top: 6%;
  height: 40%;
  border-radius: 50%/12px;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,.35) 30%, rgba(255,255,255,.9) 50%, rgba(255,255,255,.35) 70%, transparent);
  opacity: 0;
  transition: opacity .4s ease;
}
.mirror.show { opacity: 1; }
.litmus {
  position: absolute;
  top: -32px;
  left: 50%;
  transform: translateX(-50%) rotate(-5deg);
  width: 12px;
  height: 36px;
  background: #C9B8E0;
  border: 1px solid #A996C4;
  border-radius: 2px;
  box-shadow: var(--sh-1);
  transition: background-color .4s ease;
}
.litmus.lit-red { background: #D8435A; border-color: #A82E42; }
.litmus.lit-blue { background: #2F6FC7; border-color: #1F4E92; }
.vnote {
  font-size: .78rem;
  color: var(--ink);
  margin-top: 9px;
  min-height: 2.4em;
  line-height: 1.35;
}
.vnote .rn {
  display: block;
  color: var(--muted);
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .03em;
  margin-bottom: 1px;
}
.vdots {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-top: 7px;
  flex-wrap: wrap;
}
.vdots i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
  background: var(--muted);
  box-shadow: var(--sh-1);
}
.vdots i.o-none {
  background: transparent;
  border: 1.5px solid var(--line);
  box-shadow: none;
}
.rgs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.rg {
  border: 1.5px solid var(--line);
  background: var(--card);
  border-radius: 10px;
  padding: 9px 13px;
  font-size: .9rem;
  box-shadow: var(--sh-1);
  color: var(--ink);
}
.rg:disabled { opacity: .4; box-shadow: none; }
.rg:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
.explog { display: grid; gap: 8px; margin: 10px 0 4px; }
.expitem {
  background: var(--code);
  border-radius: 12px;
  padding: 10px 13px;
  border: 1px solid var(--line);
}
.expname {
  font-family: var(--font-d);
  font-weight: 700;
  font-size: .88rem;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.expname .seq {
  flex: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--ac, var(--cyan));
  color: var(--acink, #06151e);
  font-size: .68rem;
  font-weight: 800;
  display: grid;
  place-items: center;
}
.expgrid { display: grid; gap: 4px; }
.expcell {
  display: flex;
  gap: 7px;
  align-items: flex-start;
  font-size: .85rem;
  color: var(--ink);
}
.expcell i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-top: 5px;
  flex: none;
  background: var(--muted);
  box-shadow: var(--sh-1);
}
.expcell i.o-none {
  background: transparent;
  border: 1.5px solid var(--line);
  box-shadow: none;
}
.expcell b { color: var(--muted); font-weight: 600; margin-right: 1px; }
.asg {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px 12px;
  align-items: center;
  margin: 12px 0;
}
.asg select {
  font: inherit;
  padding: 9px 10px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
  width: 100%;
}

/* AI */
.abanner {
  display: flex;
  gap: 10px;
  align-items: center;
  background: var(--code);
  border-radius: 12px;
  padding: 10px 13px;
  margin-bottom: 12px;
  font-size: .88rem;
  color: var(--muted);
  border: 1px solid var(--line);
}
.adot {
  flex: none;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--muted);
}
.abanner.ready .adot {
  background: var(--green);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent);
}
.abanner.off .adot { background: var(--pink); }
.alog {
  display: grid;
  gap: 10px;
  margin-bottom: 12px;
  min-height: 40px;
  max-height: 52vh;
  overflow-y: auto;
  padding-right: 2px;
}
.bubrow { display: flex; gap: 8px; align-items: flex-end; }
.bubrow.u { justify-content: flex-end; }
.bavatar {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--ac);
  color: var(--acink);
  display: grid;
  place-items: center;
  font-family: var(--font-d);
  font-weight: 800;
  font-size: .72rem;
}
.bub {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 16px;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-size: .95rem;
  box-shadow: var(--sh-1);
}
.bub.u {
  background: var(--cyan);
  color: var(--cyan-ink);
  border-bottom-right-radius: 5px;
}
.bub.a {
  background: var(--card);
  border: 1px solid var(--line);
  border-bottom-left-radius: 5px;
}
.bub.err { background: var(--bad-bg); border-color: var(--pink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chip {
  border: 1.5px solid var(--line);
  background: var(--card);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: .86rem;
  text-align: left;
  box-shadow: var(--sh-1);
  color: var(--ink);
}
.chip:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
.chip:disabled { box-shadow: none; }
.ain { display: flex; gap: 8px; align-items: flex-end; }
.ain textarea {
  flex: 1;
  font: inherit;
  padding: 11px 14px;
  border-radius: 16px;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
  resize: none;
  min-height: 46px;
}

/* Floating chemistry background */
.chem-bg-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.chem-node {
  position: absolute;
  pointer-events: auto;
  cursor: pointer;
  transition: filter 0.3s, transform 0.1s linear;
  user-select: none;
  opacity: 0.55;
}
.chem-node svg {
  overflow: visible;
  filter: drop-shadow(0 0 6px rgba(85, 230, 223, 0.25));
}
.chem-node:hover {
  opacity: 0.95;
}
.chem-node:hover svg {
  filter: drop-shadow(0 0 12px rgba(85, 230, 223, 0.7));
}
.chem-node line {
  stroke: var(--cyan);
  stroke-width: 1.8;
  opacity: 0.4;
}
.chem-node circle {
  fill: #0c1c2e;
  stroke: var(--cyan);
  stroke-width: 1.5;
  opacity: 0.7;
}
.chem-node text {
  fill: #a5f3fc;
  font-size: 11px;
  font-family: monospace;
  font-weight: bold;
  opacity: 0.8;
}
.chem-popover {
  position: fixed;
  z-index: 100;
  background: rgba(13, 27, 46, 0.96);
  border: 1px solid var(--cyan);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(85,230,223,0.2);
  border-radius: 12px;
  padding: 14px 16px;
  max-width: 280px;
  backdrop-filter: blur(8px);
  color: var(--ink);
  transform: translate(-50%, -100%) translateY(-15px);
  display: none;
  animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.chem-popover.show { display: block; }
.chem-popover h4 {
  margin: 0 0 4px;
  color: var(--cyan);
  font-size: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.chem-popover .formula {
  color: var(--gold);
  font-family: monospace;
  font-size: 13px;
  margin-bottom: 6px;
}
.chem-popover p {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}
.chem-popover .close-pop {
  cursor: pointer;
  color: var(--muted);
  font-size: 14px;
  font-weight: bold;
  background: none;
  border: 0;
  padding: 0 4px;
}
.chem-popover .close-pop:hover { color: #fff; }
@keyframes popIn {
  from { opacity: 0; transform: translate(-50%, -90%) scale(0.9); }
  to { opacity: 1; transform: translate(-50%, -100%) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .chem-node { transition: none; }
  .mi.bad { animation: none; }
  .prog i { transition: none; }
}
@media (max-width: 430px) {
  .mg { gap: 6px; }
  .mi { font-size: .82rem; padding: 8px; }
}
</style>
</head>
<body>

<div class="chem-popover" id="chemPopover">
  <h4><span id="popTitle">Phân tử</span> <button class="close-pop" type="button" onclick="hidePopover()">✕</button></h4>

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
</button>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
var $ = function(s, r){ return (r || document).querySelector(s); };
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function T(head, rows){
  return '<div class="tw"><table><thead><tr>' + head.map(function(h){ return '<th>'+h+'</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>'+c+'</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
}
function RX(s){ return '<p class="rx">' + s + '</p>'; }
function KEY(s){ return '<div class="key">' + s + '</div>'; }
var NOP = "Không có hiện tượng";

/* ---------- progress ---------- */
var SKEY = "h12-arena-lab-v2";
var P = { name:"", xp:0, dayStreak:0, bestDay:0, lastDay:"", mix:0, exams:{}, ch:{}, weekKey:"", weekScores:[] };
try { var raw = JSON.parse(localStorage.getItem(SKEY)); if (raw && typeof raw === "object") { P = Object.assign(P, raw); } } catch(e){}
function save(){ try { localStorage.setItem(SKEY, JSON.stringify(P)); } catch(e){} }
function cp(id){ if (!P.ch[id]) P.ch[id] = { quiz:0, lab:0, known:{} }; if (!P.ch[id].known) P.ch[id].known = {}; return P.ch[id]; }
function pad2(n){ n=String(n); return n.length<2 ? "0"+n : n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function weekKey(){ var d=new Date(); var day=d.getDay()||7; d.setDate(d.getDate()-day+1); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function setHud(){
  var hx=$("#hudXp"), hs=$("#hudSt");
  if(hx) hx.textContent = P.xp;
  if(hs) hs.textContent = P.dayStreak;
}
function addXp(n){
  P.xp += n;
  // weekly scoreboard
  var wk = weekKey();
  if (P.weekKey !== wk) { P.weekKey = wk; P.weekScores = []; }
  var found = false;
  for (var i=0;i<P.weekScores.length;i++){
    if (P.weekScores[i].name === P.name) { P.weekScores[i].pts += n; found=true; break; }
  }
  if (!found && P.name) P.weekScores.push({ name:P.name, pts:n });
  P.weekScores.sort(function(a,b){ return b.pts - a.pts; });
  P.weekScores = P.weekScores.slice(0, 20);
  save(); setHud();
}
function checkDayStreak(){
  var t = todayStr();
  if (P.lastDay === t) return; // already counted today
  if (!P.lastDay) {
    P.dayStreak = 1;
  } else {
    var prev = new Date(P.lastDay + "T12:00:00");
    var now = new Date(t + "T12:00:00");
    var diff = Math.round((now - prev) / 86400000);
    if (diff === 1) P.dayStreak++;
    else P.dayStreak = 1;
  }
  if (P.dayStreak > P.bestDay) P.bestDay = P.dayStreak;
  P.lastDay = t;
  save(); setHud();
}
/* keep empty stubs so old call sites don't break */
function streakUp(){}
function streakReset(){}

/* ---------- content (from File 1 structure) ---------- */
var CH = [
/* ===== CHƯƠNG 1 ===== */
{
 id:1, sym:"O", ac:"#ffd166", acink:"#2a1a00",
 name:"Ester – Lipid", sub:"Danh pháp, thủy phân, xà phòng hóa",
 lessons:[
  { t:"Ester: khái niệm và danh pháp", h:
   '<p>Khi thay nhóm –OH trong nhóm carboxyl (–COOH) của carboxylic acid bằng nhóm –OR’ thì được ester.</p>' +
   RX('RCOOR’  (R là H hoặc gốc hydrocarbon; R’ là gốc hydrocarbon)') +
   '<p>Ester no, đơn chức, mạch hở có công thức chung C<sub>n</sub>H<sub>2n</sub>O<sub>2</sub> (n ≥ 2), là đồng phân của carboxylic acid no, đơn chức cùng số C.</p>' +
   '<p><b>Cách gọi tên:</b> tên gốc R’ + tên anion gốc acid (đuôi -ate).</p>' +
   T(["Công thức","Tên gọi"],[
     ["HCOOCH<sub>3</sub>","methyl formate"],
     ["CH<sub>3</sub>COOC<sub>2</sub>H<sub>5</sub>","ethyl acetate"],
     ["C<sub>2</sub>H<sub>5</sub>COOCH<sub>3</sub>","methyl propionate"],
     ["CH<sub>3</sub>COOCH=CH<sub>2</sub>","vinyl acetate"],
     ["CH<sub>2</sub>=CHCOOCH<sub>3</sub>","methyl acrylate"],
     ["CH<sub>2</sub>=C(CH<sub>3</sub>)COOCH<sub>3</sub>","methyl methacrylate"]
   ]) },
  { t:"Tính chất vật lý và điều chế", h:
   '<ul><li>Ester thường là chất lỏng, nhẹ hơn nước, ít tan trong nước.</li>' +
   '<li>Nhiệt độ sôi thấp hơn carboxylic acid và alcohol có phân tử khối tương đương vì giữa các phân tử ester không có liên kết hydrogen.</li>' +
   '<li>Nhiều ester có mùi thơm: isoamyl acetate (chuối chín), ethyl butyrate (dứa), benzyl acetate (hoa nhài).</li></ul>' +
   '<p><b>Điều chế – phản ứng ester hóa:</b></p>' +
   RX('RCOOH + R’OH ⇌ RCOOR’ + H<sub>2</sub>O  (H<sub>2</sub>SO<sub>4</sub> đặc, t°)') +
   KEY('Phản ứng thuận nghịch. Muốn tăng hiệu suất: dùng dư một chất đầu, hoặc lấy bớt ester hay nước ra khỏi hệ.') },
  { t:"Tính chất hóa học của ester: thủy phân", h:
   '<p><b>Môi trường acid</b> (thuận nghịch):</p>' +
   RX('RCOOR’ + H<sub>2</sub>O ⇌ RCOOH + R’OH  (H<sub>2</sub>SO<sub>4</sub> loãng, t°)') +
   '<p><b>Môi trường base – xà phòng hóa</b> (một chiều):</p>' +
   RX('RCOOR’ + NaOH → RCOONa + R’OH  (t°)') +
   '<p><b>Các trường hợp đặc biệt:</b></p>' +
   T(["Loại ester","Phản ứng với NaOH dư"],[
     ["Ester của phenol","CH<sub>3</sub>COOC<sub>6</sub>H<sub>5</sub> + 2NaOH → CH<sub>3</sub>COONa + C<sub>6</sub>H<sub>5</sub>ONa + H<sub>2</sub>O (tỉ lệ 1 : 2)"],
     ["Ester vinyl","CH<sub>3</sub>COOCH=CH<sub>2</sub> + NaOH → CH<sub>3</sub>COONa + CH<sub>3</sub>CHO"],
     ["Ester của formic acid HCOOR","Có nhóm –CHO nên còn cho phản ứng tráng bạc"]
   ]) },
  { t:"Lipid và chất béo", h:
   '<p><b>Lipid</b> là các hợp chất hữu cơ có trong tế bào sống, không tan trong nước nhưng tan trong dung môi hữu cơ không phân cực. Gồm chất béo, sáp, steroid, phospholipid…</p>' +
   '<p><b>Chất béo</b> (triglyceride) là trieste của glycerol với acid béo, công thức chung (RCOO)<sub>3</sub>C<sub>3</sub>H<sub>5</sub>.</p>' +
   '<p><b>Acid béo</b> là carboxylic acid đơn chức, mạch carbon dài (khoảng 12–24 C), không phân nhánh, số C chẵn.</p>' +
   T(["Acid béo","Công thức","Loại"],[
     ["palmitic","C<sub>15</sub>H<sub>31</sub>COOH","no"],
     ["stearic","C<sub>17</sub>H<sub>35</sub>COOH","no"],
     ["oleic","C<sub>17</sub>H<sub>33</sub>COOH","không no (1 nối đôi)"],
     ["linoleic","C<sub>17</sub>H<sub>31</sub>COOH","không no (2 nối đôi)"]
   ]) +
   '<p><b>Mỡ</b> là chất béo rắn (gốc acid béo no, thường từ động vật). <b>Dầu</b> là chất béo lỏng (gốc không no, thường từ thực vật).</p>' },
  { t:"Tính chất của chất béo, xà phòng và chất giặt rửa", h:
   '<p><b>Thủy phân trong acid</b> (thuận nghịch):</p>' +
   RX('(RCOO)<sub>3</sub>C<sub>3</sub>H<sub>5</sub> + 3H<sub>2</sub>O ⇌ 3RCOOH + C<sub>3</sub>H<sub>5</sub>(OH)<sub>3</sub>') +
   '<p><b>Xà phòng hóa</b> (một chiều):</p>' +
   RX('(RCOO)<sub>3</sub>C<sub>3</sub>H<sub>5</sub> + 3NaOH → 3RCOONa + C<sub>3</sub>H<sub>5</sub>(OH)<sub>3</sub>') +
   '<p><b>Hydro hóa</b> chất béo lỏng thành chất béo rắn (Ni, t°, p):</p>' +
   RX('(C<sub>17</sub>H<sub>33</sub>COO)<sub>3</sub>C<sub>3</sub>H<sub>5</sub> + 3H<sub>2</sub> → (C<sub>17</sub>H<sub>35</sub>COO)<sub>3</sub>C<sub>3</sub>H<sub>5</sub>') +
   '<ul><li><b>Xà phòng</b> là muối sodium hoặc potassium của acid béo.</li>' +
   '<li><b>Chất giặt rửa tổng hợp</b> là muối như sodium alkyl sulfate, sodium alkylbenzene sulfonate. Phân tử có đầu ưa nước và đuôi kị nước.</li>' +
   '<li>Trong nước cứng, xà phòng tạo kết tủa (RCOO)<sub>2</sub>Ca; chất giặt rửa tổng hợp không kết tủa với Ca<sup>2+</sup>, Mg<sup>2+</sup>.</li></ul>' },
  { t:"Mẹo giải nhanh", h:
   '<ul><li>Xà phòng hóa chất béo: n(NaOH) = 3·n(chất béo) = 3·n(glycerol).</li>' +
   '<li>Ester đơn chức + NaOH: n(NaOH) = n(ester), trừ ester của phenol (tỉ lệ 1 : 2).</li>' +

 name:"Hợp chất nitrogen", sub:"Amine, amino acid, peptide, protein",
 lessons:[
  { t:"Amine: khái niệm, phân loại, danh pháp", h:
   '<p>Amine là dẫn xuất của ammonia khi thay một hay nhiều nguyên tử H bằng gốc hydrocarbon.</p>' +
   T(["Loại","Ví dụ","Tên gọi"],[
     ["Bậc 1","CH<sub>3</sub>NH<sub>2</sub>","methylamine"],
     ["Bậc 2","(CH<sub>3</sub>)<sub>2</sub>NH","dimethylamine"],
     ["Bậc 3","(CH<sub>3</sub>)<sub>3</sub>N","trimethylamine"],
     ["Thơm","C<sub>6</sub>H<sub>5</sub>NH<sub>2</sub>","aniline (phenylamine)"]
   ]) },
  { t:"Tính chất vật lý và hóa học của amine", h:
   '<ul><li>Amine có mùi đặc trưng (cá ươn ở các amine mạch ngắn).</li>' +
   '<li>Amine mạch ngắn tan tốt trong nước, tạo liên kết hydrogen.</li></ul>' +
   '<p><b>Tính base:</b></p>' +
   RX('RNH<sub>2</sub> + HCl → RNH<sub>3</sub>Cl') +
   RX('RNH<sub>2</sub> + H<sub>2</sub>O ⇌ RNH<sub>3</sub><sup>+</sup> + OH<sup>–</sup>') +
   KEY('Lực base: aliphatic amine > ammonia > aniline. Aniline yếu hơn vì cặp e của N tham gia liên hợp với vòng benzene.') +
   '<p><b>Phản ứng với nước bromine (aniline):</b> tạo 2,4,6-tribromoaniline (kết tủa trắng).</p>' },
  { t:"Amino acid", h:
   '<p>Amino acid là hợp chất hữu cơ tạp chức chứa đồng thời nhóm amino (–NH<sub>2</sub>) và carboxyl (–COOH). Amino acid thiên nhiên chủ yếu là α-amino acid.</p>' +
   T(["Tên","Công thức","Đặc điểm"],[
     ["Glycine","H<sub>2</sub>NCH<sub>2</sub>COOH","Đơn giản nhất"],
     ["Alanine","H<sub>2</sub>NCH(CH<sub>3</sub>)COOH",""],
     ["Lysine","H<sub>2</sub>N[CH<sub>2</sub>]<sub>4</sub>CH(NH<sub>2</sub>)COOH","2 nhóm –NH<sub>2</sub>"],
     ["Glutamic acid","HOOC[CH<sub>2</sub>]<sub>2</sub>CH(NH<sub>2</sub>)COOH","2 nhóm –COOH"]
   ]) +
   '<p><b>Tính lưỡng tính:</b> phản ứng với cả acid và base.</p>' +
   RX('H<sub>2</sub>NCH<sub>2</sub>COOH + HCl → ClH<sub>3</sub>NCH<sub>2</sub>COOH') +
   RX('H<sub>2</sub>NCH<sub>2</sub>COOH + NaOH → H<sub>2</sub>NCH<sub>2</sub>COONa + H<sub>2</sub>O') },
  { t:"Peptide và protein", h:
   '<p><b>Liên kết peptide</b> (–CO–NH–) tạo thành khi nhóm –COOH của amino acid này phản ứng với nhóm –NH<sub>2</sub> của amino acid kia, giải phóng H<sub>2</sub>O.</p>' +
   '<p>Dipeptide: 2 amino acid; tripeptide: 3; polypeptide: nhiều. Protein là polypeptide có phân tử khối lớn (từ hàng chục nghìn trở lên).</p>' +
   '<p><b>Phản ứng màu biuret:</b> peptide từ 2 liên kết peptide trở lên (từ tripeptide) với Cu(OH)<sub>2</sub>/OH<sup>–</sup> cho màu tím.</p>' +
   '<p><b>Đông tụ protein:</b> nhiệt độ cao, acid/kiềm mạnh, muối kim loại nặng làm biến tính và đông tụ.</p>' },
  { t:"Mẹo giải nhanh", h:
   '<ul><li>Amine bậc 1 + HCl: n(muối) = n(amine).</li>' +
   '<li>Amino acid trung tính (số –NH<sub>2</sub> = số –COOH) không đổi màu quỳ tím.</li>' +
   '<li>Số dipeptide từ 2 amino acid khác nhau: 2 (AB và BA).</li>' +
   '<li>Protein đơn giản thủy phân hoàn toàn → các α-amino acid.</li></ul>' }
 ],

/* ===== CHƯƠNG 4 ===== */
{
 id:4, sym:"n", ac:"#a78bfa", acink:"#1a1240",
 name:"Polymer", sub:"Monomer, trùng hợp, trùng ngưng, vật liệu",
 lessons:[
  { t:"Khái niệm và các polymer thường gặp", h:
   '<p>Polymer là hợp chất có phân tử khối rất lớn do nhiều đơn vị nhỏ gọi là <b>mắt xích</b> liên kết với nhau. <b>Monomer</b> là phân tử nhỏ phản ứng với nhau tạo ra polymer. Hệ số n gọi là <b>hệ số polymer hóa</b>.</p>' +
   RX('M(polymer) = n × M(mắt xích)') +
   T(["Polymer","Monomer","Phản ứng"],[
     ["polyethylene (PE)","CH<sub>2</sub>=CH<sub>2</sub>","trùng hợp"],
     ["poly(vinyl chloride) (PVC)","CH<sub>2</sub>=CHCl","trùng hợp"],
     ["polystyrene (PS)","CH<sub>2</sub>=CH–C<sub>6</sub>H<sub>5</sub>","trùng hợp"],
     ["poly(methyl methacrylate) (PMMA)","CH<sub>2</sub>=C(CH<sub>3</sub>)COOCH<sub>3</sub>","trùng hợp"],
     ["polyacrylonitrile (tơ olon)","CH<sub>2</sub>=CH–CN","trùng hợp"],
     ["polyisoprene (cao su thiên nhiên)","isoprene","trùng hợp"],
     ["polybutadiene (cao su buna)","buta-1,3-diene","trùng hợp"],
     ["nylon-6,6","H<sub>2</sub>N[CH<sub>2</sub>]<sub>6</sub>NH<sub>2</sub> + HOOC[CH<sub>2</sub>]<sub>4</sub>COOH","trùng ngưng"],
     ["nylon-6 (capron)","H<sub>2</sub>N[CH<sub>2</sub>]<sub>5</sub>COOH","trùng ngưng"],
     ["PET","HOOC–C<sub>6</sub>H<sub>4</sub>–COOH + HOCH<sub>2</sub>CH<sub>2</sub>OH","trùng ngưng"]
   ]) },
  { t:"Phân loại và cách điều chế", h:
   '<p><b>Theo nguồn gốc:</b> thiên nhiên (cellulose, tinh bột, cao su thiên nhiên, tơ tằm), tổng hợp (PE, PVC, nylon), bán tổng hợp (tơ visco, tơ acetate).</p>' +
   T(["","Trùng hợp","Trùng ngưng"],[
     ["Bản chất","Kết hợp nhiều phân tử nhỏ giống nhau thành polymer","Kết hợp nhiều phân tử nhỏ thành polymer + giải phóng phân tử nhỏ (H<sub>2</sub>O…)"],
     ["Điều kiện monomer","Có liên kết bội (C=C) hoặc vòng kém bền","Có từ 2 nhóm chức trở lên có khả năng phản ứng"],
     ["Ví dụ","nCH<sub>2</sub>=CH<sub>2</sub> → (–CH<sub>2</sub>–CH<sub>2</sub>–)<sub>n</sub>","nH<sub>2</sub>N[CH<sub>2</sub>]<sub>6</sub>NH<sub>2</sub> + nHOOC[CH<sub>2</sub>]<sub>4</sub>COOH → nylon-6,6 + 2nH<sub>2</sub>O"]
   ]) },
  { t:"Chất dẻo, tơ, cao su, composite", h:
   '<ul><li><b>Chất dẻo:</b> PE, PVC, PS, PMMA…</li>' +
   '<li><b>Tơ:</b> thiên nhiên (bông, tơ tằm), bán tổng hợp (visco, acetate), tổng hợp (nylon-6,6, capron, olon).</li>' +
   '<li><b>Cao su:</b> thiên nhiên (polyisoprene); buna (polybutadiene); buna-S, buna-N.</li>' +
   '<li><b>Composite:</b> chất nền (polymer) + chất độn (sợi, bột…).</li></ul>' },
  { t:"Lưu hóa cao su", h:
   '<p>Đun nóng cao su với lưu huỳnh tạo cầu nối disulfide (–S–S–) giữa các mạch → cấu trúc mạng không gian.</p>' +
   KEY('Cao su lưu hóa đàn hồi tốt hơn, bền hơn, chịu nhiệt và khó tan hơn cao su thô.') },
  { t:"Mẹo giải nhanh", h:
   '<ul><li>n = M(polymer) / M(mắt xích). Ví dụ PVC M = 250000 → n = 4000.</li>' +
   '<li>Trùng hợp: m(polymer) = m(monomer) × H.</li>' +
   '<li>Trùng ngưng: m(polymer) = m(monomer) – m(H<sub>2</sub>O).</li>' +
   '<li>Nhận biết bằng đốt: tơ tằm mùi tóc cháy; bông mùi giấy cháy; PVC khó cháy, khói đen, mùi xốc.</li></ul>' }
 ],

/* ---------- state & shell ---------- */
var S = { view:"home", ch:0, tab:"learn", examId:null };
var app = $("#app");

function go(view, ch){ S.view = view; if (ch !== undefined) S.ch = ch; S.tab = "learn"; window.scrollTo(0,0); render(); }
$("#brand").onclick = function(){ go("home"); };

function render(){
  if (S.view === "home") return renderHome();
  if (S.view === "mix") return renderMix();
  renderChapter();
}

/* ---------- home ---------- */
function progText(ch){
  var p = cp(ch.id), kn = Object.keys(p.known).length;
  return "Ôn nhanh " + kn + "/" + ch.cards.length + " · Bài tập " + (p.quiz ? p.quiz + "%" : "chưa làm") + " · Lab " + (p.lab ? p.lab + " điểm" : "chưa làm");
}
function renderHome(){
  var greet = P.name ? "Xin chào, <b style=\"color:var(--cyan)\">"+P.name+"</b> · Chuỗi "+P.dayStreak+" ngày" : "";
  var h = '<section class="hero"><div class="eyebrow">CHEMISTRY • KNOWLEDGE • ARENA</div><h1>Chinh phục đấu trường<br><span>Hóa học 12</span></h1><p>Ôn tập kiến thức qua thử thách tương tác. Mỗi chương có nền tảng, ôn nhanh, bài tập và phòng lab nhận biết.</p>'+(greet?'<p style="margin-top:8px;font-size:.95rem">'+greet+'</p>':'')+'</section><div class="grid">';
  CH.forEach(function(ch, i){
    h += '<button class="cc" type="button" data-ch="'+i+'" style="--ac:'+ch.ac+';--acink:'+ch.acink+'">' +
      '<div class="tile"><small>'+ch.id+'</small>'+ch.sym+'</div>' +
      '<div><h3>Chương '+ch.id+'. '+ch.name+'</h3><div class="sub">'+ch.sub+'</div><div class="pg">'+progText(ch)+'</div></div></button>';
  });
  h += '<button class="cc mixcard" type="button" id="mixBtn" style="--ac:var(--gold);--acink:#2a1a00"><div class="tile">∑</div><div><h3>Đề cuối kỳ học kỳ I</h3><div class="sub">4 đề · form 3 phần (MCQ · Đúng/Sai · TL ngắn)</div><div class="pg">'+examProgText()+'</div></div></button></div>';
  h += '<p class="note">Nội dung theo khung chương trình Hóa học 12 học kỳ I. Tiến độ & bảng xếp hạng tuần lưu trên thiết bị này. Chạm kính lúp góc phải để hỏi nhanh.</p>';
  app.innerHTML = h;
  app.querySelectorAll("[data-ch]").forEach(function(b){ b.onclick = function(){ go("ch", parseInt(b.getAttribute("data-ch"),10)); }; });
  $("#mixBtn").onclick = function(){ go("mix"); };
}
function examProgText(){
  if (!P.exams) P.exams = {};
  var done = 0, best = 0;
  EXAMS.forEach(function(ex){ var s = P.exams[ex.id]; if (s) { done++; if (s > best) best = s; } });
  if (!done) return "Chưa làm đề nào";
  return "Đã làm "+done+"/"+EXAMS.length+" đề · Cao nhất "+best+"%";
}

/* ---------- chapter shell ---------- */
var TABS = [["learn","Nền tảng"],["cards","Ôn nhanh"],["quiz","Bài tập"],["lab","Phòng lab"]];
function renderChapter(){
  var ch = CH[S.ch];
  var h = '<div style="--ac:'+ch.ac+';--acink:'+ch.acink+'"><button class="link" type="button" id="back">‹ Tất cả chương</button>' +
    '<div class="chhead"><div class="tile"><small>'+ch.id+'</small>'+ch.sym+'</div><div><h2>'+ch.name+'</h2><p>'+ch.sub+'</p></div></div>' +
    '<div class="tabs" role="tablist">' + TABS.map(function(t){ return '<button class="tab" role="tab" type="button" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>'; }).join("") + '</div>' +
    '<div id="tabBody"></div></div>';
  app.innerHTML = h;
  $("#back").onclick = function(){ go("home"); };
  app.querySelectorAll(".tab").forEach(function(b){
    b.onclick = function(){ S.tab = b.getAttribute("data-tab"); app.querySelectorAll(".tab").forEach(function(x){ x.setAttribute("aria-selected", String(x === b)); }); mountTab(); };
  });
  mountTab();
}
function mountTab(){
  var el = $("#tabBody");
  if (S.tab === "learn") mountLearn(el);
  else if (S.tab === "cards") mountCards(el);
  else if (S.tab === "quiz") mountQuiz(el, { list: shuffle(CH[S.ch].quiz.slice()), id: CH[S.ch].id, title: "Bài tập chương " + CH[S.ch].id, intro: "Nhiều câu trắc nghiệm (MCQ), đúng–sai và tính toán. Thứ tự xáo mỗi lần. MCQ/SA đúng: 100 điểm; mỗi ý đúng–sai: 25 điểm.", reshuffle: function(){ return shuffle(CH[S.ch].quiz.slice()); } });
  else if (S.tab === "lab") mountLab(el);
}

/* ---------- learn ---------- */
function mountLearn(el){
  var ch = CH[S.ch];
  el.innerHTML = ch.lessons.map(function(l, i){
    return '<details class="card"'+(i===0?' open':'')+'><summary>'+l.t+'</summary><div class="lb">'+l.h+'</div></details>';
  }).join("") + '<div class="row"><button class="btn" type="button" id="toCards">Sang ôn nhanh</button></div>';
  $("#toCards").onclick = function(){ S.tab = "cards"; renderChapter(); };
}

/* ---------- cards ---------- */
function mountCards(el){
  var ch = CH[S.ch], p = cp(ch.id), mode = "deck";
  function head(){
    return '<div class="seg"><button class="chip" type="button" data-m="deck" aria-pressed="'+(mode==="deck")+'">Thẻ ghi nhớ</button><button class="chip" type="button" data-m="match" aria-pressed="'+(mode==="match")+'">Ghép cặp</button></div>';
  }
  function bindHead(){
    el.querySelectorAll("[data-m]").forEach(function(b){ b.onclick = function(){ mode = b.getAttribute("data-m"); start(); }; });
  }
  function start(){ if (mode === "deck") deck(); else match(); }

  function deck(){
    var queue = shuffle(ch.cards.map(function(_, i){ return i; })), pos = 0, flipped = false, again = {}, knownNow = 0;
    function draw(){
      if (pos >= queue.length) return done();
      var c = ch.cards[queue[pos]];
      el.innerHTML = head() +
        '<div class="prog"><i style="width:'+Math.round(pos/queue.length*100)+'%"></i></div>' +
        '<p class="hint">Thẻ '+(pos+1)+'/'+queue.length+' · Chạm vào thẻ để lật</p>' +
        '<button class="fc'+(flipped?' back':'')+'" type="button" id="fc"><div>'+(flipped ? c[1] : c[0])+'<small>'+(flipped ? "Đáp án" : "Câu hỏi")+'</small></div></button>' +
        '<div class="row"><button class="btn ghost" type="button" id="no"'+(flipped?'':' disabled')+'>Chưa nhớ</button><button class="btn" type="button" id="yes"'+(flipped?'':' disabled')+'>Đã nhớ</button></div>';
      bindHead();
      $("#fc").onclick = function(){ flipped = !flipped; draw(); };
      $("#yes").onclick = function(){
        var idx = queue[pos];
        if (!p.known[idx]) { p.known[idx] = true; addXp(10); }
        knownNow++; pos++; flipped = false; draw();
      };
      $("#no").onclick = function(){
        var idx = queue[pos];
        if (!again[idx]) { again[idx] = true; queue.push(idx); }
        pos++; flipped = false; draw();
      };
    }
    function done(){
      var kn = Object.keys(p.known).length;
      el.innerHTML = head() + '<div class="card"><h3>Hết bộ thẻ</h3><p>Bạn đã nhớ '+kn+'/'+ch.cards.length+' thẻ của chương này.</p><div class="row"><button class="btn" type="button" id="again">Ôn lại</button><button class="btn ghost" type="button" id="toQuiz">Làm bài tập</button></div></div>';
      bindHead();
      $("#again").onclick = deck;
      $("#toQuiz").onclick = function(){ S.tab = "quiz"; renderChapter(); };
    }
    draw();
  }

  function match(){
    var picks = shuffle(ch.cards.map(function(_, i){ return i; })).slice(0, 5);
    var left = shuffle(picks), right = shuffle(picks), sel = null, doneSet = {}, misses = 0;
    function draw(){
      el.innerHTML = head() + '<p class="hint">Chạm một ý bên trái rồi chạm đáp án tương ứng bên phải.</p><div class="mg"><div class="mgc" id="ml"></div><div class="mgc" id="mr"></div></div><p class="hint" id="mmsg"></p>';
      bindHead();
      var L = $("#ml"), R = $("#mr");
      L.style.display = R.style.display = "grid"; L.style.gap = R.style.gap = "8px"; L.style.alignContent = R.style.alignContent = "start";
      left.forEach(function(i){
        var b = document.createElement("button"); b.type = "button"; b.className = "mi" + (doneSet[i] ? " done" : "") + (sel === i ? " sel" : "");
        b.innerHTML = ch.cards[i][0]; b.disabled = !!doneSet[i];
        b.onclick = function(){ sel = i; draw(); };
        L.appendChild(b);
      });
      right.forEach(function(i){
        var b = document.createElement("button"); b.type = "button"; b.className = "mi" + (doneSet[i] ? " done" : "");
        b.innerHTML = ch.cards[i][1]; b.disabled = !!doneSet[i];
        b.onclick = function(){
          if (sel === null) { $("#mmsg").textContent = "Hãy chọn một ý ở cột bên trái trước."; return; }
          if (sel === i) {
            doneSet[i] = true; sel = null;
            if (Object.keys(doneSet).length === picks.length) return finish();
            draw();
          } else {
            misses++; b.classList.add("bad"); $("#mmsg").textContent = "Chưa khớp, thử lại nhé.";
          }
        };
        R.appendChild(b);
      });
    }
    function finish(){
      var gain = Math.max(10, 50 - misses * 10); addXp(gain);
      el.innerHTML = head() + '<div class="card"><h3>Ghép xong</h3><p>Bạn ghép sai '+misses+' lần và nhận '+gain+' điểm.</p><div class="row"><button class="btn" type="button" id="more">Ván khác</button></div></div>';
      bindHead(); $("#more").onclick = match;
    }
    draw();
  }
  start();
}

/* ---------- quiz ---------- */
function mountQuiz(el, cfg){
  var st = { i:0, xp:0, right:0, max:cfg.list.length * 100 };
  function intro(){
    el.innerHTML = '<div class="card"><h3>'+cfg.title+'</h3><p>'+cfg.intro+'</p><button class="btn" type="button" id="qs">Bắt đầu</button></div>';
    $("#qs").onclick = function(){ st.i = 0; st.xp = 0; st.right = 0; show(); };
  }
  function show(){
    if (st.i >= cfg.list.length) return end();
    var q = cfg.list[st.i];
    var partLabel = q.part ? (' · Phần '+q.part) : '';
    var partHint = q.part==="I" ? "Trắc nghiệm nhiều phương án" : q.part==="II" ? "Đúng / Sai" : q.part==="III" ? "Trả lời ngắn" : "";
    el.innerHTML = '<div class="card"><div class="qmeta"><span>Câu '+(st.i+1)+'/'+cfg.list.length+partLabel+(partHint?' · '+partHint:'')+'</span><span>Điểm: '+st.xp+'</span></div><div class="qtext">'+q.q+'</div><div id="qbox"></div><div id="qfb"></div></div>';
    var box = $("#qbox");
    if (q.t === "mcq") mcq(q, box); else if (q.t === "tf") tf(q, box); else sa(q, box);
  }
  function finishQ(gain, all, html){
    st.xp += gain; addXp(gain);
    if (all) { st.right++; streakUp(); } else { streakReset(); }
    var last = st.i >= cfg.list.length - 1;
    $("#qfb").innerHTML = '<div class="fb '+(all?'ok':'bad')+'">'+html+'</div><div class="row"><button class="btn" type="button" id="qn">'+(last?"Xem kết quả":"Câu tiếp")+'</button></div>';
    $("#qn").onclick = function(){ st.i++; show(); };
    $("#qn").focus();
  }
  function mcq(q, box){
    var opts = shuffle(q.o.map(function(t, k){ return { t:t, ok:k === q.a }; })), locked = false;
    box.className = "opts";
    opts.forEach(function(o, idx){
      var b = document.createElement("button"); b.type = "button"; b.className = "opt";
      b.innerHTML = '<span class="k">'+"ABCD"[idx]+'</span><span>'+o.t+'</span>';
      b.onclick = function(){
        if (locked) return; locked = true;
        var btns = box.children;
        for (var k=0;k<btns.length;k++){ btns[k].disabled = true; if (opts[k].ok) btns[k].classList.add("ok"); }
        if (!o.ok) b.classList.add("bad");
        finishQ(o.ok ? 100 : 0, o.ok, '<b>'+(o.ok ? "Chính xác. " : "Chưa đúng. ")+'</b>'+q.e);
      };
      box.appendChild(b);
    });
  }
  function tf(q, box){
    var ans = q.s.map(function(){ return null; });
    box.innerHTML = q.s.map(function(s, i){
      return '<div class="tfr" data-i="'+i+'"><div>'+"abcd"[i]+') '+s.x+'</div><div class="tg"><button type="button" data-v="1" aria-pressed="false">Đúng</button><button type="button" data-v="0" aria-pressed="false">Sai</button></div><div class="ex"></div></div>';
    }).join("") + '<button class="btn" type="button" id="tfc" disabled>Kiểm tra</button>';
    var rows = box.querySelectorAll(".tfr"), chk = $("#tfc"), locked = false;
    rows.forEach(function(r, i){
      r.querySelectorAll("button").forEach(function(b){
        b.onclick = function(){
          if (locked) return;
          ans[i] = b.getAttribute("data-v") === "1";
          r.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); });
          chk.disabled = ans.some(function(a){ return a === null; });
        };
      });
    });
    chk.onclick = function(){
      locked = true; chk.classList.add("hidden");
      var right = 0;
      q.s.forEach(function(s, i){
        var ok = ans[i] === s.v; if (ok) right++;
        rows[i].classList.add(ok ? "ok" : "bad");
        rows[i].querySelector(".ex").innerHTML = (ok ? "Đúng. " : "Chưa đúng. ") + s.e;
        rows[i].querySelectorAll("button").forEach(function(x){ x.disabled = true; });
      });
      finishQ(right * 25, right === q.s.length, '<b>Bạn đúng '+right+'/'+q.s.length+' ý.</b> Xem giải thích ở từng ý phía trên.');
    };
  }
  function sa(q, box){
    box.innerHTML = '<div class="sa"><input id="sai" type="text" inputmode="decimal" autocomplete="off" placeholder="Nhập đáp số"><button class="btn" type="button" id="sac">Kiểm tra</button></div><p class="hint">Có thể dùng dấu phẩy hoặc dấu chấm cho số thập phân.</p>';
    var inp = $("#sai"), btn = $("#sac"), locked = false;
    function check(){
      if (locked) return;
      var v = parseFloat(inp.value.replace(",", "."));
      if (isNaN(v)) { inp.focus(); return; }
      locked = true; inp.disabled = true; btn.disabled = true;
      var ok = Math.abs(v - q.a) <= (q.tol || 0.01);
      finishQ(ok ? 100 : 0, ok, '<b>'+(ok ? "Chính xác. " : "Chưa đúng, đáp số là " + String(q.a).replace(".", ",") + ". ")+'</b>'+q.e);
    }
    btn.onclick = check;
    inp.onkeydown = function(e){ if (e.key === "Enter") check(); };
    inp.focus();
  }
  function end(){
    var pct = Math.round(st.xp / st.max * 100);
    if (String(cfg.id).indexOf("exam-") === 0) {
      if (!P.exams) P.exams = {};
      var eid = cfg.id.slice(5);
      if (!P.exams[eid] || pct > P.exams[eid]) P.exams[eid] = pct;
      if (pct > (P.mix||0)) P.mix = pct;
    } else {
      var p = cp(cfg.id); if (pct > p.quiz) p.quiz = pct;
    }
    save();
    var msg = pct >= 80 ? "Rất tốt, bạn nắm chắc phần này." : pct >= 50 ? "Khá ổn. Xem lại các câu sai ở phần Nền tảng rồi làm lại." : "Hãy đọc lại phần Nền tảng và ôn thẻ trước khi làm lại.";
    var isExam = String(cfg.id).indexOf("exam-") === 0;
    el.innerHTML = '<div class="card"><div class="big">'+pct+'%</div><p>Bạn đúng '+st.right+'/'+cfg.list.length+' câu và được '+st.xp+'/'+st.max+' điểm. '+msg+'</p><div class="row"><button class="btn" type="button" id="qa">Làm lại</button>' +
      (isExam ? '<button class="btn ghost" type="button" id="qh">Chọn đề khác</button><button class="btn ghost" type="button" id="homeBtn">Về trang chủ</button>' : '<button class="btn ghost" type="button" id="ql">Sang phòng lab</button>') + '</div></div>';
    $("#qa").onclick = function(){ cfg.reshuffle && (cfg.list = cfg.reshuffle()); st.max = cfg.list.length * 100; st.i = 0; st.xp = 0; st.right = 0; show(); };
    if (isExam) {
      $("#qh").onclick = function(){ S.examId = null; renderMix(); };
      $("#homeBtn").onclick = function(){ go("home"); };

/* ---------- lab ---------- */
function classifyOutcome(text){
  var t = text, o = { liquid:null, ppt:null, gas:false, mirror:false, litmus:null, none:false };
  if (/quỳ tím hóa đỏ/i.test(t)) o.litmus = "red";
  else if (/quỳ tím hóa xanh/i.test(t)) o.litmus = "blue";
  else if (/quỳ tím( không đổi màu| không đổi)/i.test(t)) o.litmus = "none";
  if (/xanh tím/i.test(t)) o.liquid = "violet";
  else if (/xanh lam/i.test(t)) o.liquid = "blue";
  if (/kết tủa vàng/i.test(t)) o.ppt = "yellow";
  else if (/đỏ gạch/i.test(t)) o.ppt = "brick";
  else if (/kết tủa trắng|trắng đục|trắng(?!.*không)/i.test(t)) o.ppt = "white";
  else if (/kết tủa xanh/i.test(t)) o.ppt = "blue";
  else if (/vón cục|đông tụ/i.test(t)) o.ppt = "curd";
  if (/sủi bọt|có khí/i.test(t)) o.gas = true;
  if (/bạc sáng bóng|lớp bạc|bám thành/i.test(t)) o.mirror = true;
  if (/tách thành hai lớp|không tan\b/i.test(t)) o.liquid = o.liquid || "layer";
  else if (/tan (hoàn toàn|dần)|tan,/i.test(t) && !o.ppt) o.liquid = o.liquid || "clear";
  if (t === NOP && !o.litmus) o.none = true;
  return o;
}
function swatchColor(o){
  if (!o || o.none) return null;
  if (o.mirror) return "#C9C9C9";
  if (o.ppt === "yellow") return "#F3C61B";
  if (o.ppt === "brick") return "#B14523";
  if (o.ppt === "white") return "#CBD6D3";
  if (o.ppt === "blue") return "#1E52C9";
  if (o.ppt === "curd") return "#D8C99A";
  if (o.liquid === "blue") return "#1858D6";
  if (o.liquid === "violet") return "#3F208C";
  if (o.litmus === "red") return "#D8435A";
  if (o.litmus === "blue") return "#2F6FC7";
  if (o.gas) return "#6FB8C4";
  return "var(--muted)";
}
function bubbleHtml(n){
  var s = "";
  for (var i=0;i<n;i++){
    var left = 15 + Math.random()*70, delay = (Math.random()*1.2).toFixed(2), size = (4+Math.random()*3).toFixed(1);
    s += '<span class="bub-p" style="left:'+left.toFixed(0)+'%;width:'+size+'px;height:'+size+'px;animation-delay:'+delay+'s"></span>';
  }
  return s;
}
function glassHtml(k, state, justPoured){
  var liq = state && state.o ? state.o : null;
  var liquidCls = "liquid" + (liq ? " filled" : "") + (liq && liq.liquid ? " c-" + liq.liquid : (liq ? " c-clear" : ""));
  var pptCls = "ppt" + (liq && liq.ppt ? " show p-" + liq.ppt : "");
  var mirrorCls = "mirror" + (liq && liq.mirror ? " show" : "");
  var litmusCls = "litmus" + (liq && liq.litmus === "red" ? " lit-red" : liq && liq.litmus === "blue" ? " lit-blue" : "");
  return '<div class="vlabel">Lọ '+["A","B","C"][k]+'</div><div class="glasswrap">' +
    (liq && liq.litmus ? '<div class="'+litmusCls+'"></div>' : '') +
    '<div class="glass'+(justPoured?' pour':'')+'"><div class="'+liquidCls+'"></div><div class="'+pptCls+'"></div><div class="'+mirrorCls+'"></div>' +
    (liq && liq.gas ? '<div class="bubbles">'+bubbleHtml(5)+'</div>' : '') +
    '<div class="gloss"></div></div></div>';
}
function mountLab(el){
  var ch = CH[S.ch], lab = ch.lab, labels = ["A","B","C"];
  var order = shuffle([0,1,2]);
  var used = {}, expLog = [], hist = [[],[],[]], uses = 0, wrong = 0, solved = false, guess = [-1,-1,-1], msg = "", justPoured = false;
  function draw(){
    var h = '<div class="card" style="--ac:'+ch.ac+';--acink:'+ch.acink+'"><h3>'+lab.title+'</h3><p class="labintro">'+lab.intro+'</p>' +
      '<div class="vials">' + labels.map(function(l,k){
        var cur = hist[k].length ? hist[k][hist[k].length-1] : null;
        var dots = hist[k].map(function(x){ var c = swatchColor(x.o); return '<i class="'+(c?'':'o-none')+'" style="'+(c?'background:'+c:'')+'" title="'+x.reagent+'"></i>'; }).join("");
        return '<div class="vial">'+glassHtml(k, cur, justPoured) +
          '<div class="vnote">'+(cur ? '<span class="rn">'+cur.reagent+'</span>'+cur.text : "Chưa thử thuốc thử nào") + '</div>' +
          (hist[k].length ? '<div class="vdots">'+dots+'</div>' : '') +
        '</div>';
      }).join("") + '</div>' +
      '<h4>Thuốc thử</h4><div class="rgs">' + lab.reagents.map(function(r, i){ return '<button class="rg" type="button" data-r="'+i+'"'+(used[i]||solved?' disabled':'')+'>'+r.n+'</button>'; }).join("") + '</div>' +
      '<p class="hint">Chọn một thuốc thử để nhỏ vào cả ba lọ cùng lúc. Càng dùng ít thuốc thử, điểm càng cao.</p>';
    justPoured = false;
    if (expLog.length) {
      h += '<h4>Nhật ký thí nghiệm</h4><div class="explog">' + expLog.map(function(i, idx){
        var r = lab.reagents[i];
        var cells = order.map(function(si,k){
          var t = r.r[si], o = classifyOutcome(t), c = swatchColor(o), text = t === NOP ? "không có hiện tượng" : t.replace(/<[^>]+>/g,"");
          return '<div class="expcell"><i class="'+(c?'':'o-none')+'" style="'+(c?'background:'+c:'')+'"></i><b>Lọ '+labels[k]+':</b> '+text+'</div>';
        }).join("");
        return '<div class="expitem"><div class="expname"><span class="seq">'+(idx+1)+'</span>'+r.n+'</div><div class="expgrid">'+cells+'</div></div>';
      }).join("") + '</div>';
    }
    h += '<h4>Xác nhận nhãn</h4><div class="asg">' + labels.map(function(l, k){
      return '<label for="g'+k+'"><b>Lọ '+l+'</b></label><select id="g'+k+'"'+(solved?' disabled':'')+'><option value="-1">Chọn chất…</option>' +
        lab.samples.map(function(s, si){ return '<option value="'+si+'"'+(guess[k]===si?' selected':'')+'>'+s.replace(/<[^>]+>/g,"")+'</option>'; }).join("") + '</select>';
    }).join("") + '</div>';
    if (!solved) h += '<button class="btn" type="button" id="lchk">Kiểm tra</button>';
    if (msg) h += '<div class="fb '+(solved?'ok':'bad')+'">'+msg+'</div>';
    if (solved) h += '<div class="row"><button class="btn" type="button" id="lagain">Chơi lại</button></div>';
    h += '</div>';
    el.innerHTML = h;
    el.querySelectorAll(".rg").forEach(function(b){
      b.onclick = function(){
        var i = parseInt(b.getAttribute("data-r"),10), r = lab.reagents[i];
        used[i] = true; expLog.push(i); uses++; msg = ""; justPoured = true;
        order.forEach(function(si, k){
          var text = r.r[si];
          hist[k].push({ reagent: r.n, text: text === NOP ? "Không có hiện tượng" : text.replace(/<[^>]+>/g,""), o: classifyOutcome(text) });
        });
        draw();
      };
    });
    labels.forEach(function(_, k){ $("#g"+k).onchange = function(e){ guess[k] = parseInt(e.target.value,10); }; });
    var c = $("#lchk");
    if (c) c.onclick = function(){
      if (guess.some(function(g){ return g < 0; })) { msg = "Hãy chọn chất cho cả ba lọ."; draw(); return; }
      if (uses === 0) { msg = "Hãy làm ít nhất một thí nghiệm trước khi kết luận."; draw(); return; }
      if (guess.slice().sort().join() !== "0,1,2") { msg = "Mỗi chất chỉ ứng với một lọ. Kiểm tra lại các lựa chọn."; draw(); return; }
      var ok = guess.every(function(g, k){ return g === order[k]; });
      if (ok) {
        solved = true;
        var score = Math.max(20, 120 - 20 * uses - 10 * wrong);
        var p = cp(ch.id), gain = Math.max(0, score - p.lab);
        if (score > p.lab) p.lab = score;
        addXp(gain); streakUp();
        msg = '<b>Chính xác. Bạn được '+score+' điểm sau '+uses+' thí nghiệm.</b><br>' + labels.map(function(l, k){ return 'Lọ '+l+': '+lab.samples[order[k]]; }).join("<br>") + '<br><br>' + lab.explain;
      } else {
        wrong++; streakReset();
        msg = "Chưa đúng. Hãy xem lại các lọ và nhật ký thí nghiệm.";
      }
      draw();
    };
    var ag = $("#lagain"); if (ag) ag.onclick = function(){ mountLab(el); };
  }
  draw();
}

  panel.classList.add("show");

  panel.onclick = function(e){ if (e.target === panel) panel.classList.remove("show"); };
  var log = $("#alog"), inp = $("#atext"), send = $("#asend");
  function avatar(role){ return role === "u" ? '<div class="bavatar" style="background:var(--track);color:var(--ink)">Bạn</div>' : '<div class="bavatar">'+ch.sym+'</div>'; }
  function bubble(cls, text){
    if (!log) return;
    var row = document.createElement("div"); row.className = "bubrow " + cls;
    row.innerHTML = (cls === "a" ? avatar("a") : "") + '<div class="bub '+cls+'"></div>' + (cls === "u" ? avatar("u") : "");
    log.appendChild(row);
    var bub = row.querySelector(".bub");
    if (bub) bub.textContent = text;
    log.scrollTop = log.scrollHeight;
  }
  hist.forEach(function(m){ bubble(m.role === "user" ? "u" : "a", m.content); });
  var sug = $("#asug");
  if (sug) sug.innerHTML = (ch.ask||[]).map(function(s,i){ return '<button class="chip" type="button" data-s="'+i+'">'+s+'</button>'; }).join("");
  inner.querySelectorAll("[data-s]").forEach(function(b){
    b.onclick = function(){ if (inp) { inp.value = ch.ask[parseInt(b.getAttribute("data-s"),10)]; inp.focus(); } };
  });
  function localReply(q){
    var ql = q.toLowerCase();
    if (/xà phòng hóa|một chiều/.test(ql)) return "Xà phòng hóa là phản ứng thủy phân ester (hoặc chất béo) trong môi trường base. Muối carboxylate tạo thành không tham gia phản ứng ngược với alcohol, nên phản ứng một chiều (khác thủy phân acid là thuận nghịch).";
    if (/hai muối|phenol/.test(ql)) return "Ester của phenol (ví dụ CH₃COOC₆H₅) khi đun với NaOH dư tạo hai muối: CH₃COONa và C₆H₅ONa (tỉ lệ 1:2).";
    if (/tráng bạc|formic|hcoor/.test(ql)) return "Chỉ ester của formic acid (HCOOR) có nhóm –CHO nên cho phản ứng tráng bạc.";
    if (/glucose|fructose|bromine|br2/.test(ql)) return "Phân biệt glucose và fructose: dùng nước bromine. Glucose (aldehyde) làm mất màu bromine; fructose (ketone) không mất màu.";
    if (/saccharose|tráng/.test(ql)) return "Saccharose không có nhóm –CHO tự do nên không tráng bạc. Thủy phân hoàn toàn rồi mới tráng bạc (1 saccharose → 4Ag).";
    if (/biuret/.test(ql)) return "Phản ứng biuret cho màu tím với Cu(OH)₂/OH⁻ khi có từ 2 liên kết peptide trở lên (tripeptide, polypeptide, protein). Dipeptide không đủ.";
    if (/trùng hợp|trùng ngưng/.test(ql)) return "Trùng hợp: monomer có liên kết bội (C=C), bảo toàn khối lượng. Trùng ngưng: monomer có ≥2 nhóm chức, giải phóng H₂O (hoặc phân tử nhỏ khác).";
    if (/lưu hóa|cao su/.test(ql)) return "Lưu hóa: đun cao su với lưu huỳnh tạo cầu nối –S–S– giữa các mạch polymer → mạng không gian, bền và đàn hồi hơn.";
    if (/tính.*n|mắt xích|pvc/.test(ql)) return "Hệ số polymer hóa n = M(polymer) / M(mắt xích). Ví dụ PVC M = 250000, mắt xích 62,5 → n = 4000.";
    return "Bạn có thể hỏi cụ thể hơn về: " + (ch.ask||[]).join("; ") + ". Hoặc xem lại phần Nền tảng và Ôn nhanh của chương này nhé!";
  }
  function sendMsg(){
    if (!inp) return;
    var q = inp.value.trim(); if (!q) return;
    hist.push({ role:"user", content:q }); bubble("u", q); inp.value = "";
    setTimeout(function(){ var ans = localReply(q); hist.push({ role:"assistant", content:ans }); bubble("a", ans); }, 350);
  }
  if (send) send.onclick = sendMsg;
  if (inp) {
    inp.onkeydown = function(e){ if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); } };
    setTimeout(function(){ try { inp.focus(); } catch(e){} }, 100);
  }
}

var chemNodes = [];
var mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
var tiltX = 0, tiltY = 0;

function initChemBackground(){
  var container = document.getElementById("chemBg");
  if (!container) return;
  container.innerHTML = "";
  chemNodes.length = 0;
  var count = Math.min(moleculesData.length, Math.floor(window.innerWidth / 180) + 2);
  for (var i = 0; i < count; i++) {
    var data = moleculesData[i % moleculesData.length];
    var el = document.createElement("div");
    el.className = "chem-node";
    el.innerHTML = data.svg;
    var x = Math.random() * (window.innerWidth - 100);
    var y = Math.random() * (window.innerHeight - 100);
    var node = {
      el: el, data: data, x: x, y: y,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      vr: (Math.random() - 0.5) * 0.12,
      rot: Math.random() * 360,
      offsetX: 0, offsetY: 0
    };
    el.addEventListener("click", function(n){
      return function(e){ e.stopPropagation(); showPopover(n, e.clientX, e.clientY); };
    }(node));
    container.appendChild(el);
    chemNodes.push(node);
  }
}

function animateChemBackground(){
  var width = window.innerWidth, height = window.innerHeight;
  chemNodes.forEach(function(node){
    node.x += node.vx;
    node.y += node.vy;
    node.rot += node.vr;
    if (node.x < -20 || node.x > width - 70) node.vx *= -1;
    if (node.y < -20 || node.y > height - 70) node.vy *= -1;
    var dx = mouseX - (node.x + 40);
    var dy = mouseY - (node.y + 40);
    var dist = Math.sqrt(dx * dx + dy * dy);
    var pushX = 0, pushY = 0;
    if (dist < 160) {
      var force = (160 - dist) / 160;
      pushX = -(dx / dist) * force * 16;
      pushY = -(dy / dist) * force * 16;
    }
    var gyroX = tiltY * 0.6;
    var gyroY = tiltX * 0.6;
    node.offsetX += (pushX + gyroX - node.offsetX) * 0.05;
    node.offsetY += (pushY + gyroY - node.offsetY) * 0.05;
    node.el.style.transform = "translate3d(" + (node.x + node.offsetX).toFixed(1) + "px," + (node.y + node.offsetY).toFixed(1) + "px,0) rotate(" + node.rot.toFixed(1) + "deg)";
  });
  requestAnimationFrame(animateChemBackground);
}

window.addEventListener("mousemove", function(e){ mouseX = e.clientX; mouseY = e.clientY; });
window.addEventListener("deviceorientation", function(e){
  if (e.gamma !== null && e.beta !== null) { tiltX = e.gamma; tiltY = e.beta; }
});

function showPopover(node, clickX, clickY){
  document.getElementById("popTitle").textContent = node.data.name;
  document.getElementById("popFormula").textContent = node.data.formula;
  document.getElementById("popDesc").textContent = node.data.desc;
  var pop = document.getElementById("chemPopover");
  pop.style.left = clickX + "px";
  pop.style.top = clickY + "px";
  pop.classList.add("show");
}
function hidePopover(){ document.getElementById("chemPopover").classList.remove("show"); }
window.hidePopover = hidePopover;
document.addEventListener("click", function(e){
  var pop = document.getElementById("chemPopover");
  if (pop && !pop.contains(e.target) && !e.target.closest(".chem-node")) hidePopover();
});
window.addEventListener("resize", function(){ initChemBackground(); });

/* ---------- init ---------- */
var fabSearch = $("#fabSearch"), btnLb = $("#btnLb");
if (fabSearch) fabSearch.onclick = openAIPanel;
if (btnLb) btnLb.onclick = showLeaderboard;

try {
  if (!P.name) {
    showNameGate();
  } else {
    setFabVisible(true);
    checkDayStreak();
    setHud();
    render();
  }
} catch (err) {
  console.error("Init error:", err);
  // fallback: still try to show home
  try { setHud(); render(); } catch(e2){}
}
try { initChemBackground(); animateChemBackground(); } catch(e3){ console.warn("BG init:", e3); }
})();
